name: CI

# linux-tests 暂时移除：pykep 3.0.1 manylinux wheel 缺 tops/ 数据目录，
# `import pykep` 直接 FileNotFoundError (参考 esa/pykep#217)。
# 待 Linux wheel 稳定后，再按 PLAN.md 的「测试 / CI」待办恢复。
# Windows job 仍然运行全部非 slow 测试，覆盖纯逻辑 + Playwright。

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Download pykep and pygmo wheels
        shell: pwsh
        run: |
          $release = "https://github.com/inertialobs/pykep-pygmo-win-wheels/releases/download/PyKEP-v3.0.1-PyGMO-v2.19.8"
          $pykep = Join-Path $env:RUNNER_TEMP "pykep-3.0.1-cp314-cp314-win_amd64.whl"
          $pygmo = Join-Path $env:RUNNER_TEMP "pygmo-2.19.8-cp314-cp314-win_amd64.whl"
          curl.exe --fail --location "$release/pykep-3.0.1-cp314-cp314-win_amd64.whl" --output $pykep
          curl.exe --fail --location "$release/pygmo-2.19.8-cp314-cp314-win_amd64.whl" --output $pygmo
          python -m pip install $pykep $pygmo
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run tests
        run: python -m pytest -m "not slow"
