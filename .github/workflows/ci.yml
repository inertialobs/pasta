name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install frontend test dependencies
        run: python -m pip install -r requirements-dev.txt Flask==3.1.3 Werkzeug==3.1.8 Jinja2==3.1.6
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests not requiring native pykep
        run: python -m pytest -m "not requires_pykep and not slow"

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Download pykep and pygmo wheels
        shell: pwsh
        run: |
          $release = "https://github.com/inertialobs/pykep-pygmo-win-wheels/releases/download/PyKEP-v3.0.1-PyGMO-v2.19.8"
          $pykep = Join-Path $env:RUNNER_TEMP "pykep-3.0.1-cp314-cp314-win_amd64.whl"
          $pygmo = Join-Path $env:RUNNER_TEMP "pygmo-2.19.8-cp314-cp314-win_amd64.whl"
          curl.exe --fail --location "$release/pykep-3.0.1-cp314-cp314-win_amd64.whl" --output $pykep
          curl.exe --fail --location "$release/pygmo-2.19.8-cp314-cp314-win_amd64.whl" --output $pygmo
          python -m pip install $pykep $pygmo
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run tests
        run: python -m pytest -m "not slow"
